     ============================================================= -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Tienda v4.0 - TurespuestoYa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">⚡</span>
                <h1 class="text-xl font-black text-amber-500 tracking-wide uppercase">TurespuestoYa <span class="text-xs bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded-full border border-amber-500/30">v4.0</span></h1>
            </div>
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-3 py-1.5 rounded-xl text-xs transition border border-slate-700">Ver Catálogo 🌐</a>
        </div>
    </header>

    <main class="max-w-xl w-full mx-auto p-4 flex-grow flex items-center justify-center my-6">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl w-full flex flex-col gap-6">
            
            <div class="text-center">
                <span class="text-3xl mb-2 inline-block">🏢</span>
                <h2 class="text-xl font-black text-white uppercase tracking-wide">Únete como Tienda</h2>
                <p class="text-xs text-slate-400 mt-1">Completa tus datos para empezar a vender repuestos</p>
            </div>

            <form id="formRegistro" class="flex flex-col gap-4">
                
                <div>
                    <label class="text-xs text-slate-400 font-bold mb-1.5 block">Nombre de la Tienda</label>
                    <input type="text" id="regNombre" placeholder="Ej. Repuestos El Motor" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-xs focus:border-amber-500 focus:outline-none transition">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-slate-400 font-bold mb-1.5 block">Ciudad</label>
                        <select id="regCiudad" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-xs focus:border-amber-500 focus:outline-none transition cursor-pointer">
                            <option value="" disabled selected>Selecciona una ciudad</option>
                            <option value="San Cristóbal">San Cristóbal</option>
                            <option value="Maracay">Maracay</option>
                            <option value="Valencia">Valencia</option>
                            <option value="Caracas">Caracas</option>
                            <option value="Barquisimeto">Barquisimeto</option>
                            <option value="Maracaibo">Maracaibo</option>
                            <option value="Mérida">Mérida</option>
                            <option value="Barinas">Barinas</option>
                            <option value="Puerto La Cruz">Puerto La Cruz</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 font-bold mb-1.5 block">Teléfono / WhatsApp</label>
                        <input type="text" id="regTelefono" placeholder="Ej. 04121234567" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-xs focus:border-amber-500 focus:outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-bold mb-1.5 block">Dirección Física (Local)</label>
                    <input type="text" id="regDireccion" placeholder="Ej. Av. Principal, Local 4..." required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-xs focus:border-amber-500 focus:outline-none transition">
                </div>

                <div class="border-t border-slate-800 my-1 pt-4">
                    <h3 class="text-[10px] uppercase font-bold text-amber-500 tracking-wider mb-3">Credenciales de Acceso</h3>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-slate-400 font-bold mb-1.5 block">Correo Electrónico</label>
                            <input type="email" id="regEmail" placeholder="tu-tienda@correo.com" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-xs focus:border-amber-500 focus:outline-none transition">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 font-bold mb-1.5 block">Contraseña</label>
                            <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-xs focus:border-amber-500 focus:outline-none transition">
                        </div>
                    </div>
                </div>

                <button type="submit" id="btnRegistrar" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl transition text-xs shadow-lg shadow-amber-500/20 cursor-pointer mt-2">
                    Crear Cuenta de Tienda 🚀
                </button>
            </form>

            <div class="border-t border-slate-800 pt-4 text-center">
                <p class="text-xs text-slate-400">¿Ya tienes una tienda registrada?</p>
                <a href="login.html" class="text-amber-400 hover:text-amber-300 font-bold text-xs mt-1 inline-block transition">Inicia sesión aquí 🔐</a>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 p-4 text-center text-xs text-slate-500">
        &copy; 2026 TurespuestoYa v4.0 - Todos los derechos reservados.
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        // Misma configuración que los otros archivos
        const firebaseConfig = {
            apiKey: "AIzaSyB4xzcn6XKdViHsdGnGJukyqcdAOKWtujg",
            authDomain: "turepuestoya.firebaseapp.com",
            projectId: "turepuestoya",
            databaseURL: "https://turepuestoya-default-rtdb.firebaseio.com",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        document.getElementById('formRegistro').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const nombreTienda = document.getElementById('regNombre').value.trim();
            const ciudad = document.getElementById('regCiudad').value;
            const telefonoWsp = document.getElementById('regTelefono').value.trim();
            const direccionFisica = document.getElementById('regDireccion').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            
            const btnRegistrar = document.getElementById('btnRegistrar');

            btnRegistrar.innerText = "Creando cuenta y configurando tienda...";
            btnRegistrar.disabled = true;

            // 1. Crear el usuario en Firebase Auth
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const uid = userCredential.user.uid;

                    // 2. Guardar los datos públicos de la tienda en la Base de Datos
                    return set(ref(db, 'tiendas/' + uid), {
                        nombreTienda: nombreTienda,
                        email: email,
                        ciudad: ciudad,
                        telefonoWsp: telefonoWsp,
                        direccionFisica: direccionFisica,
                        status: 'active', // Estado por defecto
                        verified: false,  // Empieza como tienda estándar (no oficial)
                        fechaRegistro: new Date().toLocaleString()
                    });
                })
                .then(() => {
                    alert("¡Tienda registrada exitosamente! Serás redirigido al panel.");
                    window.location.href = "panel.html"; // Redirigir al panel
                })
                .catch((error) => {
                    alert("Error al registrar la tienda: " + error.message);
                    btnRegistrar.innerText = "Crear Cuenta de Tienda 🚀";
                    btnRegistrar.disabled = false;
                });
        });
    </script>
</body>
</html>
